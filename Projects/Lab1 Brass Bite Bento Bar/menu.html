<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brass & Bite Bento Bar | Menu</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="menu-page">

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-warning">
        <div class="container-fluid">
            <a href="index.html" class="navbar-brand d-flex align-items-center gap-2">
                <!-- FA Icon Requirement A4: Brand Logo -->
                <img src="images/Brass&BiteBentoBarLogo.png" alt="Brass & Bite Logo" style="height: 40px;" onerror="this.style.display='none'">
                <span class="brand-title text-warning">Brass & Bite</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
                <ul class="navbar-nav gap-2">
                    <!-- FA Icon Requirement A4: Navigation links with descriptive icons -->
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i>Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="fa-solid fa-book-open me-1"></i>About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="menu.html"><i class="fa-solid fa-utensils me-1"></i>Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservations.html"><i class="fa-solid fa-calendar-check me-1"></i>Reservations</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="container my-5">
    <section class="text-center mb-4">
        <h1 class="display-4 text-warning fw-bold">Artisanal Provisions</h1>
        <p class="text-light mx-auto" style="max-width: 700px;">
            Engineered for airship captains, mechanical couriers, and aristocratic bulldogs alike.
        </p>
    </section>

    <!-- Category Filter -->
    <section class="row justify-content-center mb-4">
        <div class="col-md-6 text-center">
            <label for="categoryFilter" class="form-label text-warning fw-bold mb-2">
                <!-- FA Icon Requirement A4: Filter Icon -->
                <i class="fa-solid fa-filter me-1"></i> Filter Category:
            </label>
            <select id="categoryFilter" class="form-select bg-dark text-light border-warning text-center">
                <option value="All">All Categories</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
            </select>
        </div>
    </section>

    <!-- Single Item Carousel Card -->
    <section class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div id="carouselCard" class="card bg-dark text-light border-warning shadow-lg overflow-hidden">
                <img id="carouselImg" src="images/Gear-Griddle Bento.jpeg" class="card-img-top" alt="Menu Item" style="height: 320px; object-fit: cover;">
                <div class="card-body text-center p-4">
                    <span id="carouselBadge" class="badge bg-warning text-dark mb-2">Breakfast</span>
                    <h3 id="carouselTitle" class="text-warning h4">Loading...</h3>
                    <p id="carouselDesc" class="card-text text-light my-3"></p>
                    <h4 id="carouselPrice" class="text-warning fw-bold"></h4>
                </div>
                <div class="card-footer bg-dark border-top border-warning d-flex justify-content-between p-3">
                    <button id="prevBtn" type="button" class="btn btn-outline-warning px-4"><i class="fa-solid fa-arrow-left me-1"></i> PREV</button>
                    <button id="nextBtn" type="button" class="btn btn-outline-warning px-4">NEXT <i class="fa-solid fa-arrow-right ms-1"></i></button>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="py-3 text-center bg-dark text-light border-top border-warning mt-5">
    <p class="mb-0">&copy; 2026 Brass & Bite Bento Bar. Operated under authority of the Bulldog High Command.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
