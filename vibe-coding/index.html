<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vibe Coding</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background:
                    linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.9)),
                    url("https://plus.unsplash.com/premium_photo-1677503296916-478a17317cc2?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Z3JhbmQlMjBwaWFub3xlbnwwfHwwfHx8MA%3D%3D") center/cover no-repeat;
            color: #f0f0f0;
        }

        header {
            margin-top: 40px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }

        .login-container {
            margin: 40px 0;
            padding: 30px 40px;
            width: 90%;
            max-width: 400px;
            background: linear-gradient(135deg, #4b4b4b 0%, #2b2b2b 40%, #5a3b2b 70%, #3a2a1a 100%);
            border: 2px solid #7a4b2b;
            border-radius: 12px;
            box-shadow:
                    0 0 25px rgba(0, 0, 0, 0.8),
                    inset 0 0 10px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .login-container::before,
        .login-container::after {
            content: "";
            position: absolute;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            opacity: 0.4;
        }

        .login-container::before {
            width: 120px;
            height: 120px;
            top: -40px;
            left: -30px;
        }

        .login-container::after {
            width: 160px;
            height: 160px;
            bottom: -60px;
            right: -40px;
        }

        .login-container h1 {
            margin-bottom: 20px;
            text-align: center;
            color: #f5f5f5;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #8b6b4b;
            background: #1f1f1f;
            color: #f0f0f0;
            outline: none;
            transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #c28b4b;
            box-shadow: 0 0 6px rgba(194, 139, 75, 0.7);
            background: #262626;
        }

        input[type="submit"] {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #c28b4b, #8b5b2b);
            color: #111;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08rem;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
        }

        input[type="submit"]:hover {
            background: linear-gradient(135deg, #d29b5b, #9b6b3b);
            box-shadow: 0 0 10px rgba(210, 155, 91, 0.7);
            transform: translateY(-1px);
        }

        input[type="submit"]:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        footer {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(5, 5, 5, 0.85);
            border-top: 1px solid #333;
        }

        footer h2 {
            font-size: 1rem;
            color: #cccccc;
        }

        .footer-highlight {
            color: #e0e0e0;
            font-weight: bold;
        }
    </style>
</head>
<body>
<header>
    <h1>ENTER CREDENTIALS AND WIN A PIANO!</h1>
</header>

<main>
    <section class="login-container">
        <h1>Login</h1>
        <form action="#" method="post">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <div>
                <input type="submit" value="Submit">
            </div>
        </form>
    </section>
</main>

<footer>
    <h2>
        <span class="footer-highlight">Mark Lapham</span> &mdash;
        <span class="footer-highlight">&copy; July 30, 2026</span>
    </h2>
</footer>
</body>
</html>
